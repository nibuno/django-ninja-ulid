version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    allow:
      - dependency-type: development
    groups:
      dev-dependencies:
        patterns:
          - "*"
