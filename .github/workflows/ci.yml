name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra orm
      - run: uv run --locked ruff check .
      - run: uv run --locked mypy

  dependency-bounds:
    name: ${{ matrix.bound }} dependencies / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - bound: lowest
            python: "3.12"
            resolution: lowest-direct
          - bound: highest
            python: "3.14"
            resolution: highest
    env:
      ULID_TEST_DATABASE: sqlite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv build --wheel --python python
      - name: Install the wheel and resolve its dependencies
        env:
          RESOLUTION: ${{ matrix.resolution }}
        run: |
          uv venv --python python
          uv export --locked --only-group dev --no-hashes --no-annotate |
            grep -E '^pytest(-django)?==' > "$RUNNER_TEMP/pytest.txt"
          wheel=(dist/*.whl)
          # lowest-direct needs the library's requirements as direct inputs.
          uv pip install --python .venv/bin/python --resolution "$RESOLUTION" \
            -r pyproject.toml --extra orm "${wheel[0]}[orm]" -r "$RUNNER_TEMP/pytest.txt"
          uv pip list --python .venv/bin/python
      - name: Run all tests
        if: matrix.bound == 'lowest'
        run: .venv/bin/python -m pytest -q
      - name: Run library tests
        if: matrix.bound == 'highest'
        run: .venv/bin/python -m pytest -q -m "not upstream"

  matrix:
    runs-on: ubuntu-latest
    outputs:
      cases: ${{ steps.cases.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: cases
        run: python3 scripts/ci_matrix.py --github-output --subset ${{ github.event_name == 'pull_request' && 'pr' || 'full' }}

  test:
    needs: matrix
    name: Python ${{ matrix.python }} / Django ${{ matrix.django }} / ${{ matrix.database }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.cases) }}
    services:
      postgres:
        image: ${{ matrix.database == 'postgresql' && matrix.postgres_image || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ulid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ULID_TEST_DATABASE: ${{ matrix.database }}
      ULID_POSTGRES_HOST: 127.0.0.1
      ULID_POSTGRES_PORT: "5432"
      ULID_POSTGRES_DB: ulid_test
      ULID_POSTGRES_USER: postgres
      ULID_POSTGRES_PASSWORD: postgres
      DJANGO_VERSION: ${{ matrix.django }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked build and test tools
        run: uv sync --locked --extra orm --python python
      - name: Build wheel from sdist and check metadata
        run: |
          uv build --offline
          .venv/bin/python -m twine check dist/*
      - name: Install the wheel and selected Django
        run: |
          uv pip install --python .venv/bin/python --reinstall-package django-ninja-ulid dist/*.whl "Django==$DJANGO_VERSION"
          uv pip check --python .venv/bin/python
      - name: Test the installed wheel
        run: .venv/bin/python -m pytest -q --junitxml=local-checks/pytest.xml
      - name: Check migrations and API in a new project
        run: .venv/bin/python scripts/check_install.py --output local-checks/fresh-project.json
      - name: Check base installation without the ORM extra
        if: matrix.database == 'sqlite'
        run: |
          uv venv --python python local-checks/base-venv
          uv pip install --python local-checks/base-venv/bin/python dist/*.whl "Django==$DJANGO_VERSION"
          uv pip check --python local-checks/base-venv/bin/python
          local-checks/base-venv/bin/python -I scripts/check_type_install.py --output local-checks/base-install.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: checks-py${{ matrix.python }}-django${{ matrix.django }}-${{ matrix.database }}
          path: |
            local-checks/pytest.xml
            local-checks/fresh-project.json
            local-checks/base-install.json
          if-no-files-found: warn
          retention-days: 7
