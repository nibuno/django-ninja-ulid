name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      cases: ${{ steps.cases.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: cases
        run: python3 scripts/ci_matrix.py --github-output

  test:
    needs: matrix
    name: Python ${{ matrix.python }} / Django ${{ matrix.django }} / ${{ matrix.database }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.matrix.outputs.cases) }}
    services:
      postgres:
        image: ${{ matrix.postgres_image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ulid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ULID_TEST_DATABASE: ${{ matrix.database }}
      ULID_POSTGRES_HOST: 127.0.0.1
      ULID_POSTGRES_PORT: "5432"
      ULID_POSTGRES_DB: ulid_test
      ULID_POSTGRES_USER: postgres
      ULID_POSTGRES_PASSWORD: postgres
      DJANGO_VERSION: ${{ matrix.django }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.7.8"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked build and test tools
        run: uv sync --locked --extra orm --python python
      - name: Build wheel from sdist and check metadata
        run: |
          uv build --offline
          .venv/bin/python -m twine check dist/*
      - name: Install the wheel and selected Django
        run: |
          uv pip install --python .venv/bin/python --reinstall-package django-ninja-ulid dist/*.whl "Django==$DJANGO_VERSION"
          uv pip check --python .venv/bin/python
      - name: Test the installed wheel
        run: .venv/bin/python -m pytest -q --junitxml=local-checks/pytest.xml
      - name: Check migrations and API in a new project
        run: .venv/bin/python scripts/check_install.py --output local-checks/fresh-project.json
      - name: Check base installation without the ORM extra
        if: matrix.database == 'sqlite'
        run: |
          uv venv --python python local-checks/base-venv
          uv pip install --python local-checks/base-venv/bin/python dist/*.whl "Django==$DJANGO_VERSION"
          uv pip check --python local-checks/base-venv/bin/python
          local-checks/base-venv/bin/python -I scripts/check_type_install.py --output local-checks/base-install.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: checks-py${{ matrix.python }}-django${{ matrix.django }}-${{ matrix.database }}
          path: |
            local-checks/pytest.xml
            local-checks/fresh-project.json
            local-checks/base-install.json
          if-no-files-found: warn
          retention-days: 7
