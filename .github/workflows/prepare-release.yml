name: Prepare release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "照合する予定タグ。タグは作成しません（例: v0.1.0）"
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      release_tag:
        required: false
        default: ""
        type: string
    outputs:
      version:
        value: ${{ jobs.build.outputs.version }}
      artifact_name:
        value: ${{ jobs.build.outputs.artifact_name }}

permissions:
  contents: read

concurrency:
  group: prepare-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.inspect.outputs.version }}
      artifact_name: ${{ steps.inspect.outputs.artifact_name }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.7.8"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install build tools
        run: uv sync --locked --extra orm --python python
      - name: Build and inspect the release files
        id: inspect
        run: |
          uv build --offline --out-dir local-checks/release/dist
          .venv/bin/python -m twine check local-checks/release/dist/*
          .venv/bin/python scripts/check_release.py --dist-dir local-checks/release/dist --manifest local-checks/release/release-manifest.json --tag "$RELEASE_TAG" --commit "$GITHUB_SHA" --github-output
      - name: Check the ORM wheel in a new project
        run: |
          uv pip install --python .venv/bin/python --reinstall-package django-ninja-ulid local-checks/release/dist/*.whl
          uv pip check --python .venv/bin/python
          .venv/bin/python scripts/check_install.py --output local-checks/release/orm-install.json
      - name: Check the wheel without the ORM extra
        run: |
          uv venv --python python local-checks/release-base
          uv pip install --python local-checks/release-base/bin/python local-checks/release/dist/*.whl
          uv pip check --python local-checks/release-base/bin/python
          local-checks/release-base/bin/python -I scripts/check_type_install.py --output local-checks/release/type-install.json
      - name: Verify file hashes after installation checks
        run: python scripts/check_release.py --verify --dist-dir local-checks/release/dist --manifest local-checks/release/release-manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.inspect.outputs.artifact_name }}
          path: local-checks/release/
          if-no-files-found: error
          retention-days: 30
