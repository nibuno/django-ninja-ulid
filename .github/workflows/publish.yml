# Tag releases publish to TestPyPI and verify the downloaded wheel.
# Manual promotion reuses the verified 0.1.1 artifact; the pypi environment requires approval.
name: Publish

on:
  push:
    tags:
      - "v*"
      - "!v*-publish.*"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml
  build:
    needs: tests
    uses: ./.github/workflows/prepare-release.yml
    with:
      release_tag: ${{ github.ref_name }}

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/django-ninja-ulid/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: bundle/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: bundle/dist/

  check-testpypi:
    needs: [build, testpypi]
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.7.8"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: bundle/
      - name: Verify the build artifact
        run: python scripts/check_release.py --verify --dist-dir bundle/dist --manifest bundle/release-manifest.json
      - name: Download only this package from TestPyPI
        run: |
          python -m pip download --no-cache-dir --no-deps --only-binary=:all: --index-url https://test.pypi.org/simple/ --dest downloaded "django-ninja-ulid==$RELEASE_VERSION"
          python scripts/check_release.py --downloaded-wheel downloaded/*.whl --manifest bundle/release-manifest.json
      - name: Check the downloaded package with locked PyPI dependencies
        run: |
          uv sync --locked --extra orm --python python
          uv pip install --python .venv/bin/python --no-deps --reinstall-package django-ninja-ulid downloaded/*.whl
          .venv/bin/python scripts/check_install.py

  verify-promotion:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/tags/v0.1.1-publish.1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Confirm successful TestPyPI verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/39404044826" > source-run.json
          jq -e '.conclusion == "success" and .event == "push" and .path == ".github/workflows/publish.yml" and .head_sha == "56ef3a73dd270f9d9f46e35f5e1f87237c05aa3f"' source-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/39404044826/jobs?per_page=100" > source-jobs.json
          jq -e 'any(.jobs[]; .name == "check-testpypi" and .conclusion == "success")' source-jobs.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: "12255538139"
          run-id: "39404044826"
          github-token: ${{ github.token }}
          path: bundle/
      - name: Verify the pinned release candidate
        run: |
          cmp release-candidates/0.1.1.json bundle/release-manifest.json
          python3 scripts/check_release.py --verify --dist-dir bundle/dist --manifest release-candidates/0.1.1.json
      - name: Recheck the wheel served by TestPyPI
        run: |
          python3 -m pip download --no-cache-dir --no-deps --only-binary=:all: --index-url https://test.pypi.org/simple/ --dest downloaded "django-ninja-ulid==0.1.1"
          python3 scripts/check_release.py --downloaded-wheel downloaded/*.whl --manifest release-candidates/0.1.1.json
      - name: Write approval summary
        run: |
          {
            echo '## PyPI promotion: django-ninja-ulid 0.1.1'
            echo 'Source: https://github.com/nibuno/django-ninja-ulid/actions/runs/39404044826'
            echo 'The original wheel and sdist will be published without rebuilding.'
            echo '```json'
            cat release-candidates/0.1.1.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  pypi:
    needs: verify-promotion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/django-ninja-ulid/
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: "12255538139"
          run-id: "39404044826"
          github-token: ${{ github.token }}
          path: bundle/
      - name: Verify the exact files immediately before publishing
        run: |
          cmp release-candidates/0.1.1.json bundle/release-manifest.json
          python3 scripts/check_release.py --verify --dist-dir bundle/dist --manifest release-candidates/0.1.1.json
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: bundle/dist/
